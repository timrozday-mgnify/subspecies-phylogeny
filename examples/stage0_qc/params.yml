# Stage 0 — Genome quality control
#
# Purpose: assess genome completeness, contamination, and chimeric content
# before committing to phylogenetic analysis. Runs all QC tools on the input
# genomes alongside the SKA2 build step, producing both QC reports and the
# merged SKF that is reused in stage 1. No alignment or tree inference is
# performed.
#
# Results to review before proceeding to stage 1:
#   results/00_qc/qc/quast/<sample>/           — assembly statistics (N50, GC%)
#   results/00_qc/qc/magpurify/<sample>/       — per-contig chimera flags
#   results/00_qc/qc/checkm2/<sample>/         — completeness and contamination
#   results/00_qc/qc/checkm/<sample>/          — CheckM v1 completeness (legacy)
#   results/00_qc/qc/gunc/<sample>/            — chimeric genome detection
#   results/00_qc/qc/busco/<sample>/           — lineage-specific completeness
#   results/00_qc/fastani/fastani.txt          — pairwise ANI (QC screen)
#   results/00_qc/nj_tree/fastani_nj.nwk       — quick NJ tree to spot outliers
#   results/00_qc/ska2/merged.skf              — pass to --ska_merged_skf in stage 1
#
# Decision guidance:
#   - Completeness  < 90 %  or contamination  > 5 % (CheckM2/CheckM):
#     consider removing the genome from the analysis.
#   - GUNC maxCSS score  > 0.45: genome may be chimeric; inspect further.
#   - MAGpurify flagged contigs: review and optionally clean the FASTA before
#     re-running.
#   - FastANI ANI  < 95 % to cohort median: genome may be the wrong species.
#
# Removing problem genomes: add their sample names to a plain-text file
# (one per line) and pass it to --ska_delete_samples in stage 1. Sample names
# correspond to the FASTA filename basename (without extension); confirm exact
# names with: ska nk results/00_qc/ska2/merged.skf

input: "samplesheet.csv"
outdir: "results/00_qc"

# Skip alignment and all downstream steps — stage 0 produces QC outputs and
# the merged SKF only.
skip_alignment: true

# ------ Genome QC databases ------------------------------------------------
#
# QUAST and MAGpurify (gc-content + tetra-freq) run unconditionally.
# The tools below only run when their database path is uncommented and set.
# See the README "Reference databases" section for download commands.

# CheckM2 DIAMOND database (~3.5 GB, Zenodo)
# checkm2_db: "/path/to/checkm2_db/uniref100.KO.1.dmnd"

# CheckM v1 database root directory (~1.4 GB)
# checkm_db: "/path/to/checkm_db"

# GUNC DIAMOND database (~3.5 GB, progenomes2)
# gunc_db: "/path/to/gunc_db/gunc_db_progenomes2.0.dmnd"

# BUSCO lineage datasets directory and lineage name
# busco_lineage_db: "/path/to/busco_downloads"
# busco_lineage:    "bacteria_odb10"

# MAGpurify database for phylo-markers module (~2 GB, optional)
# magpurify_db: "/path/to/magpurify_db"
